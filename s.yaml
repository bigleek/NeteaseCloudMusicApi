edition: 1.0.0
name: my-framework-app
access: default
services:
  framework:
    component: fc
    actions:
      pre-deploy:
        - run: export PATH=/opt/nodejs16/bin:$PATH && npm install --production
          path: ./
    props:
      region: cn-hangzhou
      service:
        name: music
      function:
        name: music
        description: Initialize
        runtime: custom
        environmentVariables:
          PATH: >-
            /opt/nodejs16/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin
        layers:
          - acs:fc:cn-hangzhou:official:layers/Nodejs16/versions/2
        memorySize: 128
        cpu: 0.05
        timeout: 60
        codeUri: ./
        diskSize: 512
        caPort: 9000
        customRuntimeConfig:
          command:
            - npm
          args:
            - run
            - start
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - PATCH
